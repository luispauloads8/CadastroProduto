<div class="card rounded shadow-sm" id="card">

    <form [formGroup]="form">
        <div class="p-3">
            
            <div class="form-row">

                <div class="form-group col-md-6">
                    <label>Pessoa</label>
                    <input type="text"
                            class="form-control"
                            placeholder="Informe o nome"
                            [(ngModel)]="pessoaFiltro"
                            [ngModelOptions]="{standalone: true}"
                            (input)="onInputChangePessoa()"
                            [readonly]="pessoaSelecionada && modoEdicao" />

                    <input type="hidden" formControlName="pessoaId" />

                    <!-- Lista de resultados -->
                    <div class="dropdown-menu show p-0"
                        *ngIf="pessoasFiltradas.length && !carregandoPessoa && !(pessoaSelecionada && modoEdicao)"
                        style="max-height: 200px; overflow-y: auto; width: 20%;">
                        <button class="dropdown-item"
                                *ngFor="let pessoa of pessoasFiltradas"
                                (click)="selecionaPessoa(pessoa)">
                        {{ pessoa.nome }}
                        </button>
                    </div>

                    <!-- Loader -->
                    <div *ngIf="carregandoPessoa" class="text-muted mt-2">
                        Carregando...
                    </div>

                    <!-- Mensagem caso já tenha pessoa vinculada -->
                    <div *ngIf="pessoaSelecionada && modoEdicao" class="text-success mt-2">
                        Pessoa vinculada: {{ pessoaSelecionada.nome }}
                    </div>
                </div>

            </div>

            <div class="row g-3">
                <div class="form-group mb-3">
                    <label for="observacao" class="form-label">Observação</label>
                    <textarea id="observacao" #observacaoTextarea 
                              class="form-control"
                              *ngIf="form" formControlName="observacao"
                              (input)="ajustarAltura(observacaoTextarea)"
                              rows="3" 
                              style="overflow: hidden; resize: none;"
                              ></textarea>
                </div>
            </div>

        </div>

        <div class="card-footer">
            <div class="d-flex mt-3">
                <button class="btn btn-success w-10 mx-1" [disabled]="!form.valid" (click)="salvarCliente()">Gravar</button>
                <a class="btn btn-info w-10" [routerLink]="['/cliente/cadastro']" >voltar</a>
            </div>                
        </div>
    </form>

</div>
